name: postman-pull-request
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v2

      - name: Install Node
        uses: actions/setup-node@v1
        with:
          node-version: "16.x"

      - name: Install
        run: |
          npm install -g newman
          npm install -g newman-reporter-my_allure.tgz

      - name: Write data to file
        run: |
          echo '[{"Content-Type": "application/json","user_name": "admin"}]' > data.json

      - name: Verify file content
        run: cat data.json

      - name: Run POSTMAN collection
        run: |
          newman run pm/RB_coll.json -d data.json -r my_allure
          # newman run pm/restful-booker.postman_collection.json -e pm/booking_env.postman_environment.json -r my_allure
        continue-on-error: true

      - name: Show report
        if: always()
        run: allure serve allure-results
        continue-on-error: true

      - name: Get Allure history
        uses: actions/checkout@v2
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Allure Report action from marketplace
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v2
        env:
          PERSONAL_TOKEN: ${{ secrets.TEST_TOKEN_3 }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: allure-history
